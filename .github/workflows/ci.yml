# Builds the plug-in and the Yak package on every push to main and every pull request.
# The .yak is uploaded as a workflow artifact so it can be installed and tested before release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: ./.github/actions/setup-yak

      # Debug includes the preview commands (Commands/Preview/), which Release leaves out. Building it keeps them
      # compiling while they are reworked.
      - name: Build Debug (preview commands)
        shell: pwsh
        run: dotnet build src/Numbat/Numbat/Numbat.csproj -c Debug

      - name: Build and package
        id: package
        shell: pwsh
        run: ./scripts/Build-YakPackage.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: numbat-${{ steps.package.outputs.version }}-yak
          path: ${{ steps.package.outputs.yak_path }}
          if-no-files-found: error
