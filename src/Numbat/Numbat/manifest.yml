# Yak package manifest. The version is supplied at build time from <Version> in
# Numbat.csproj by scripts/Build-YakPackage.ps1 (yak build --version).
name: Numbat
version: $version
authors:
- Tom Dufficy
description: >
  Architectural modelling and analysis tools for Rhino 8: live gross floor
  area tracking, Abstandsflaechen (setback areas), handrails, paving,
  texture shuffling and layer utilities.
url: https://github.com/tomdufficy/Numbat
icon: numbat-icon-512.png
keywords:
- architecture
- handrail
- railing
- paving
- gfa
- abstandsflaechen
- setback
- layers
